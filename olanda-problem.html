<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Delta Works — Problem Map</title>
    <link rel="stylesheet" href="https://js.arcgis.com/4.27/esri/themes/light/main.css">
    <script src="https://js.arcgis.com/4.27/"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
    <style>
/* Design: colours come from the map itself (white paper, black ink, the red of the route).
   One type family (Barlow, a grotesk drawn from road signage) in two widths.
   The one distinctive element is the stop number shown as a route plate. */
:root {
    --paper:   #FFFFFF;
    --ink:     #000000;
    --ink-2:   #6B6B6B;
    --line:    #D9D9D9;
    --route:   #D7263D;
    --font:        'Barlow', 'Helvetica Neue', Arial, sans-serif;
    --font-narrow: 'Barlow Semi Condensed', 'Barlow', 'Arial Narrow', sans-serif;
    --panel-width: 420px;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    height: 100%; height: 100dvh;
    overflow: hidden;
    font-family: var(--font);
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
}

#viewDiv { position: fixed; inset: 0; background: #F6F1EC; }

button { font-family: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--route); outline-offset: 2px; }

/* ── LOADING ── */
#loading {
    position: fixed; inset: 0;
    background: var(--paper);
    display: flex; align-items: center; justify-content: center;
    z-index: 10000;
    transition: opacity 0.5s ease;
}
#loading.hidden { opacity: 0; pointer-events: none; }
.loading-spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--line);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.esri-popup { display: none !important; }

/* ── START ── */
#startBtn {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 900;
    padding: 12px 22px;
    background: var(--ink);
    color: var(--paper);
    border: 0;
    border-radius: 2px;
    font-size: 16px; font-weight: 500;
    cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease, background 0.15s ease;
}
#startBtn.on { opacity: 1; pointer-events: auto; }
#startBtn:hover { background: var(--route); }

/* ── SIDE PANEL (right) ── */
.side-panel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: var(--panel-width);
    background: var(--paper);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    z-index: 950;
    overflow: hidden;
    transform: translateX(100%);
    transition: transform 0.35s ease;
}
.side-panel.visible { transform: translateX(0); }

/* Video at the top, full width */
.panel-gallery {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #E6E6E6;
    overflow: hidden;
    flex-shrink: 0;
}
.panel-gallery.empty { display: none; }
.gallery-track { height: 100%; }
.gallery-slide { height: 100%; }
.gallery-slide iframe { width: 100%; height: 100%; border: 0; display: block; }
.gallery-blocked { display: flex; align-items: center; justify-content: center; background: #E6E6E6; }
.gallery-blocked .tour-btn { align-self: center; margin: 0; text-decoration: none; }
.gallery-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery-credit {
    position: absolute; left: 0; bottom: 0; z-index: 2;
    padding: 3px 8px;
    background: rgba(255,255,255,0.88);
    font-size: 12px; line-height: 1.2;
}
.gallery-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 48px; height: 48px; z-index: 3; }
.gallery-play svg { width: 22px; height: 22px; }

.sq-btn {
    width: 32px; height: 32px;
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
}
.sq-btn:hover { background: var(--ink); color: var(--paper); }
.sq-btn svg { width: 15px; height: 15px; }

.gallery-enlarge { position: absolute; top: 10px; left: 10px; z-index: 4; }

/* Heading: route plate + name + close */
.panel-head {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 20px 20px 0;
}
#nodePlate {
    flex-shrink: 0;
    min-width: 48px; height: 40px;
    padding: 0 8px;
    background: var(--route);
    color: var(--paper);
    border-radius: 4px;
    font-family: var(--font-narrow);
    font-size: 26px; font-weight: 600;
    line-height: 40px;
    text-align: center;
    font-variant-numeric: tabular-nums;
}
.panel-title { flex: 1; min-width: 0; }
.counter-text { display: block; margin-top: 4px; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
#locationName {
    font-family: var(--font-narrow);
    font-size: 24px;
    font-weight: 600;
    line-height: 1.15;
    color: var(--ink);
    padding-top: 2px;
}
.panel-close { flex-shrink: 0; }

/* Text */
.panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
}
#locationDescription {
    font-size: 16px;
    font-weight: 400;
    line-height: 1.55;
    color: var(--ink);
    white-space: pre-line;
    max-width: 62ch;
}
#locationLinks { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; }
#locationLinks a {
    font-size: 15px; font-weight: 500;
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
}
#locationLinks a:hover { color: var(--route); }

/* Previous / next stop: floating on the map, either side of the selected point */
.stop-nav {
    position: fixed;
    z-index: 800;
    width: 30px; height: 30px;
    top: 50%;
    transform: translateY(-50%);
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, background 0.15s ease, color 0.15s ease;
}
.stop-nav.on { opacity: 1; pointer-events: auto; }
.stop-nav svg { width: 13px; height: 13px; }

/* ── LIGHTBOX ── */
#lightbox {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 9000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
}
#lightbox.open { opacity: 1; pointer-events: auto; }
.lightbox-frame {
    width: min(88vw, calc(88vh * 16 / 9));
    aspect-ratio: 16 / 9;
    background: var(--ink);
}
.lightbox-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
.lightbox-frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
#lightbox-close { position: absolute; top: 16px; right: 16px; }

/* Labels button */
.labels-btn { width: 26px; height: 26px; margin-top: 2px; font-size: 12px; font-weight: 600; }
.sq-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* "Start the tour" button inside the panel */
.tour-btn {
    margin-top: 6px;
    padding: 12px 22px;
    background: var(--ink); color: var(--paper);
    border: 0; border-radius: 2px;
    font-size: 16px; font-weight: 500;
    cursor: pointer;
    align-self: flex-start;
    transition: background 0.15s ease;
}
.tour-btn:hover { background: var(--route); }

/* Legend of the elevation bands */
.legend {
    position: fixed; z-index: 800;
    right: 12px; top: 12px;
    transition: right 0.35s ease;
    background: rgba(255,255,255,0.92);
    border: 1px solid var(--line);
    padding: 8px 12px 6px;
    font-size: 14px; line-height: 1.2;
}
/* When the side panel is open the legend moves to its left */
body.panel-open .legend { right: calc(var(--panel-width) + 12px); }
.legend p { font-weight: 600; margin-bottom: 6px; }
.legend ul { list-style: none; }
.legend li { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; }
.sw { flex: 0 0 16px; height: 16px; border: 1px solid rgba(0,0,0,0.25); }
.sw svg { display: block; }

/* ArcGIS overrides */
.esri-ui-corner { margin: 12px; }
.esri-widget--button { border-radius: 0 !important; }
.esri-zoom .esri-widget--button { width: 26px; height: 26px; font-size: 12px; }

/* ── RESPONSIVE ── */
@media (max-width: 1024px) {
    :root { --panel-width: 360px; }
}
@media (max-width: 768px) {
    .side-panel { width: 300px; max-width: 62vw; }
    .panel-head { padding: 14px 14px 0; gap: 10px; }
    #nodePlate { min-width: 40px; height: 34px; line-height: 34px; font-size: 22px; }
    #locationName { font-size: 20px; }
    .panel-body { padding: 12px 14px 14px; }
    #locationDescription { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation-duration: 0.01ms !important; }
}
    </style>
</head>
<body>

<div id="loading"><div class="loading-spinner"></div></div>
<div id="viewDiv"></div>

<button id="startBtn">Start the route</button>

<!-- Detail panel — right -->
<aside class="side-panel" id="sidePanel">

    <!-- Video -->
    <div class="panel-gallery empty" id="panelGallery">
        <div class="gallery-track" id="galleryTrack"></div>
        <button class="sq-btn gallery-enlarge" id="enlargeBtn" aria-label="Enlarge" title="Enlarge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </button>
    </div>

    <!-- Route plate, name, close -->
    <div class="panel-head">
        <span id="nodePlate"></span>
        <div class="panel-title">
            <h2 id="locationName"></h2>
            <span class="counter-text" id="counterText"></span>
        </div>
        <button class="sq-btn panel-close" id="closeBtn" aria-label="Close" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
    </div>

    <!-- Text -->
    <div class="panel-body">
        <p id="locationDescription"></p>
        <div id="locationLinks"></div>
    </div>

</aside>

<!-- Labels on / off (moved into the ArcGIS UI, under the zoom buttons) -->
<button class="sq-btn labels-btn" id="labelsBtn" aria-pressed="false" title="Show labels" style="display:none">Aa</button>

<!-- Legend -->
<div class="legend">
    <p>Land elevation relative to sea level</p>
    <ul>
        <li><span class="sw" id="swBelow" style="background:#BEBEBE"></span>Below sea level</li>
        <li><span class="sw" style="background:#52c5ff"></span>0 to 2 m above sea level</li>
        <li><span class="sw" style="background:#a8e2ff"></span>2 to 4 m above sea level</li>
        <li><span class="sw" style="border:0"><svg viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="8" r="4.5" fill="#000" stroke="#fff" stroke-width="1.2"/></svg></span>Drowned village</li>
    </ul>
</div>

<!-- Previous / next stop, floating on the map -->
<button class="sq-btn stop-nav" id="prevBtn" aria-label="Previous stop" title="Previous stop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<button class="sq-btn stop-nav" id="nextBtn" aria-label="Next stop" title="Next stop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
</button>

<!-- Video lightbox -->
<div id="lightbox">
    <button class="sq-btn" id="lightbox-close" aria-label="Close video">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="lightbox-frame" id="lightboxFrame"></div>
</div>

<script>
require([
    "esri/Map", "esri/views/MapView", "esri/layers/FeatureLayer", "esri/layers/GraphicsLayer", "esri/layers/GeoJSONLayer",
    "esri/Graphic", "esri/geometry/Extent", "esri/geometry/Point", "esri/geometry/support/webMercatorUtils"
], function (Map, MapView, FeatureLayer, GraphicsLayer, GeoJSONLayer, Graphic, Extent, Point, webMercatorUtils) {

    // ── DATA ──
    const BASE       = "https://services3.arcgis.com/zhmVWeFi3qKWY2Y8/arcgis/rest/services/";
    const URL_BANDS  = BASE + "DTM10_0_2_4m_4326_less/FeatureServer/0";
    const URL_POINTS = BASE + "WAYPOINTS_OLANDA_DEF_4326/FeatureServer/1";
    // Drowned villages: open data of the Province of Zeeland (WFS, layer "Verdronken dorpen", requested as GeoJSON in WGS84).
    // If the server blocks the request from this page, download the GeoJSON from this address, publish it on ArcGIS Online
    // and put the address of the hosted layer in URL_DROWNED_HOSTED.
    const URL_DROWNED = "https://opengeodata.zeeland.nl/geoserver/chs/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=chs:geocmd_vrddrppnt&outputFormat=application/json&srsName=EPSG:4326";
    const URL_DROWNED_HOSTED = "";

    // Map scale used for every stop (1 : SCALE_STOP). Smaller number = closer.
    // The view is controlled by scale, not by zoom levels, so the stop scale is the same whatever the basemap.
    const SCALE_STOP = 50000;
    // Edited texts for the stops (key = "node" field). When a stop has no entry here, the layer text is used.
    const TEXTS = {
            "70": {
                    "title": "Eastern Scheldt Barrier",
                    "text": "The Eastern Scheldt Barrier closes the Oosterschelde between Schouwen-Duiveland and Noord-Beveland. Built from 1976 to 1986, it is 9 km long, with 65 piers and 62 floodgates. The gates stay open for the tide and are lowered only when the water is forecast to rise more than 3 m above NAP, about once a year. All of them can be closed in 82 minutes."
            },
            "4": {
                    "title": "Veerse Gatdam",
                    "text": "The Veerse Gatdam closes the Veerse Gat between Walcheren and Noord-Beveland. It was completed in 1961, a year after the Zandkreekdam, and is 2.8 km long. Together the two dams turned an inlet of the sea into the Veerse Meer, a lake without tide. The sandbanks that once lay in the inlet are now small islands used for recreation."
            },
            "35": {
                    "title": "Zandkreekdam",
                    "text": "The Zandkreekdam closes the Zandkreek between Noord-Beveland and Zuid-Beveland. Opened in 1960, it was the first Delta Work in Zeeland and is 830 m long. It gave Noord-Beveland its first road link to the mainland, ending the island's dependence on the ferry. Closing the Zandkreek first also made it easier to build the larger Veerse Gatdam."
            },
            "99": {
                    "title": "Philipsdam",
                    "text": "The Philipsdam, completed in 1987, keeps two bodies of water apart: the salt water of the Oosterschelde and the fresh water of the Volkerak-Zoommeer. It was built so that the Eastern Scheldt Barrier could stay open. With the Oesterdam, it makes the estuary smaller, so that the tide stays strong enough to preserve its natural habitats."
            },
            "76": {
                    "title": "Bathse Spuisluis",
                    "text": "The Bathse Spuisluis at Bath, completed in 1987, is a sluice that lets surplus fresh water flow out of the Zoommeer, so that its level does not rise too high. It works together with the Philipsdam and the Oesterdam, which keep the freshwater lakes and the salt Oosterschelde apart. It is one of the lesser-known Delta Works."
            },
            "72": {
                    "title": "Oesterdam",
                    "text": "The Oesterdam connects Tholen with Zuid-Beveland and separates the salt water of the Oosterschelde from the fresh water of the Bergsche Diep. Work began in 1979, but the dam could only be completed once the Eastern Scheldt Barrier was working, because the barrier had to be closed for a time during construction. With the Philipsdam, it keeps the tide in the estuary strong."
            },
            "90": {
                    "title": "Grevelingendam",
                    "text": "The Grevelingendam joins Schouwen-Duiveland and Goeree-Overflakkee. At 6 km long, it was completed in 1965 and closed the eastern end of the Grevelingen. The western end was closed by the Brouwersdam in 1971, and the former arm of the sea became the Grevelingenmeer, a saltwater lake without tide that is now used for water sports."
            },
            "88": {
                    "title": "Brouwersdam",
                    "text": "The Brouwersdam closes the Grevelingen off from the North Sea, between Goeree-Overflakkee and Schouwen-Duiveland. Completed in 1971, it made the coastline shorter and stronger and protects a large area behind it. It was the first Delta Work for which Rijkswaterstaat involved landscape architects, so the dam blends into the dunes. Today it is a centre for water sports."
            },
            "65": {
                    "title": "Flood Disaster Museum",
                    "text": "The Watersnoodmuseum stands in a creek area left by the 1953 flood, inside four caissons used to close the last breach in the dike at Ouwerkerk. In the night of 31 January to 1 February 1953, 1,836 people died in the Netherlands and 200,000 hectares of land were flooded. The museum tells this story and explains why water safety still matters."
            },
            "43": {
                    "title": "Drowned villages of South Beveland",
                    "text": "Zeeland has about 120 drowned villages. From the north coast of South Beveland you look over the Verdronken Land, a salt marsh and mudflat where villages such as Schoudee, Nieuwlande and Tolsende once stood, together with the city of Reimerswaal. Their remains lie under the mud. The Delta Works were built so that Zeeland would not lose more land.",
            "image": {
                "src": "reimerswaal-1580-map.jpg",
                "fallback": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Reijmerswale_1580_map.jpg/500px-Reijmerswale_1580_map.jpg",
                "credit": "Old map of Reimerswaal, 16th century. Wikimedia Commons"
            }
            }
    };
    // Monument for the Drowned Villages, Colijnsplaat (Noord-Beveland). Position from the Zeeland.com page; about 4 km off the route.
    const MONUMENT = {
        lon: 3.8621699810028076, lat: 51.59989547729492,
        title: "Monument for the Drowned Villages",
        // Photo of the monument: save it in the same folder as this file (see the note in the chat about the rights)
        // The photo is looked for first in this folder; if the file is not there, the Zeeland.com copy is used until you upload it.
        image: {
            src: "monument-drowned-villages.jpg",
            fallback: "https://assets.plaece.nl/odp-zeeland/image/monument-verdronken-dorpen_4209484357.jpg",
            credit: "Photo: Zeeland.com"
        },
        text: "Between the harbour of Colijnsplaat and the Zeeland Bridge, a tower with a staircase recalls the storm floods that swallowed almost all of Noord-Beveland. The names of 117 drowned villages are inscribed on its steps. A voice recites dates, among them 1404 (St Elizabeth's Flood) and 1530 (St Felix's Flood), between the sounds of wind and water. The artwork is by Lydia Schouten."
    };
    // Order of the stops: drowned land, Flood Disaster Museum (1953), Monument for the Drowned Villages
    const STOP_ORDER = [43, 65, "monument"];
    // What the user sees when the map opens: the whole route (bounding box of the track plus a 6% margin)
    const HOME = new Extent({ xmin: 3.578, ymin: 51.372, xmax: 4.276, ymax: 51.760, spatialReference: { wkid: 4326 } });
    // Space kept free around the whole route when the map opens
    const HOME_PADDING = { top: 16, bottom: 16, left: 16, right: 16 };

    // ── LAYERS ──
    // Symbol of the stops: the "target" of the Gudenå podcast points (two black rings and a red centre).
    // It is the same CIM symbol that the Gudenå WebMap uses (redrawn with the same proportions), because
    // CIM symbols are the ones a layer can draw reliably; SVG images are not.
    function cimRing(r) {
        const pts = [];
        for (let i = 0; i <= 36; i++) {
            const a = i / 36 * 2 * Math.PI;
            pts.push([32 + r * Math.cos(a), 32 + r * Math.sin(a)]);
        }
        pts[36] = pts[0].slice();
        return pts;
    }
    function cimStroke(r) {
        return {
            type: "CIMMarkerGraphic",
            geometry: { rings: [cimRing(r)] },
            symbol: { type: "CIMPolygonSymbol", symbolLayers: [{ type: "CIMSolidStroke", enable: true, width: 4.5, color: [0, 0, 0, 255] }] }
        };
    }
    function stopSymbol(size) {
        return {
            type: "cim",
            data: {
                type: "CIMSymbolReference",
                symbol: {
                    type: "CIMPointSymbol",
                    symbolLayers: [{
                        type: "CIMVectorMarker",
                        enable: true,
                        size: size,
                        frame: { xmin: 0, ymin: 0, xmax: 64, ymax: 64 },
                        scaleSymbolsProportionally: true,
                        respectFrame: true,
                        markerGraphics: [
                            cimStroke(26),
                            cimStroke(16),
                            {
                                type: "CIMMarkerGraphic",
                                geometry: { rings: [cimRing(7)] },
                                symbol: { type: "CIMPolygonSymbol", symbolLayers: [{ type: "CIMSolidFill", enable: true, color: [255, 0, 0, 255] }] }
                            }
                        ]
                    }]
                }
            }
        };
    }
    const STOP_SIZE = 16;            // normal stop
    // Static map: the view always shows the whole route; the arrows only change the panel and move the highlight.
    const STATIC_MAP = true;
    // true = the panel opens with an introduction and the "Start the tour" button; false = it opens on the first stop
    const START_WITH_INTRO = true;
    const INTRO = {
        title: "Land at risk",
        text: "Much of the land around the Oosterschelde lies below sea level or only a few metres above it. For centuries the sea took it back: Zeeland counts about 120 drowned villages. On the night of 31 January 1953 a storm flood broke through the dikes and 1,836 people died in the Netherlands. Three places along the route tell this story."
    };

    function fill(hex) {
        return { type: "simple-fill", color: hex, outline: { color: hex, width: 0.5 } };
    }

    // Land that lies below sea level or only a few metres above it. The land above 4 m and the water are not drawn.
    // Land 0 to 4 m above sea level: two blues, multiplied with the basemap
    const bandsLayer = new FeatureLayer({
        url: URL_BANDS, minScale: 0, maxScale: 0, popupEnabled: false,
        definitionExpression: "DN IN (2, 3)",
        blendMode: "multiply",   // the basemap shows through the colours
        renderer: {
            type: "unique-value", field: "DN",
            uniqueValueInfos: [
                { value: "2", symbol: fill("#52c5ff") },  // 0 to 2 m
                { value: "3", symbol: fill("#a8e2ff") }   // 2 to 4 m
            ]
        }
    });

    // Land below sea level: solid grey, a little darker than the sea of the basemap (area and outline).
    // The grey is worked out from the sea colour of the basemap once it has loaded; this is the colour used until then.
    const GRAY_FACTOR = 0.9;   // 1 = same as the sea, lower = darker
    function grayFill(v) {
        return { type: "simple-fill", color: [v, v, v, 1], outline: { color: [v, v, v, 1], width: 0.75 } };
    }
    const belowSeaLayer = new FeatureLayer({
        url: URL_BANDS, minScale: 0, maxScale: 0, popupEnabled: false,
        definitionExpression: "DN = 1",
        renderer: { type: "simple", symbol: grayFill(190) }
    });
    function setBelowSeaGray(seaRgb) {
        const lum = 0.2126 * seaRgb[0] + 0.7152 * seaRgb[1] + 0.0722 * seaRgb[2];
        const v = Math.max(0, Math.min(255, Math.round(lum * GRAY_FACTOR)));
        belowSeaLayer.renderer = { type: "simple", symbol: grayFill(v) };
        const sw = document.getElementById("swBelow");
        if (sw) sw.style.background = "rgb(" + v + "," + v + "," + v + ")";
        console.info("Below sea level grey: " + v + " (sea colour of the basemap: " + seaRgb.join(",") + ")");
    }
    // Reads the sea (water fill) colour from the style of the vector basemap
    function seaColorFromStyle(st) {
        const water = st.layers.filter(sl => sl.type === "fill" && /water/i.test(sl.id) && sl.paint && sl.paint["fill-color"]);
        for (let k = 0; k < water.length; k++) {
            let col = water[k].paint["fill-color"];
            if (col && col.stops && col.stops.length) col = col.stops[0][1];
            if (typeof col !== "string") continue;
            const ctx = document.createElement("canvas").getContext("2d");
            ctx.fillStyle = "#000000";
            ctx.fillStyle = col;
            const v = ctx.fillStyle;
            const m = v.charAt(0) === "#"
                ? [parseInt(v.slice(1, 3), 16), parseInt(v.slice(3, 5), 16), parseInt(v.slice(5, 7), 16)]
                : (v.match(/[\d.]+/g) || []).slice(0, 3).map(Number);
            if (m.length === 3 && m.every(n => !isNaN(n))) return m;
        }
        return null;
    }

    // The drowned villages: small black dots with a white edge. Their names appear when the map is zoomed in.
    const drownedSymbol = { type: "simple-marker", style: "circle", size: 6, color: "#000000", outline: { color: "#ffffff", width: 1 } };
    const drownedLayer = URL_DROWNED_HOSTED
        ? new FeatureLayer({ url: URL_DROWNED_HOSTED, minScale: 0, maxScale: 0, popupEnabled: false, renderer: { type: "simple", symbol: drownedSymbol } })
        : new GeoJSONLayer({ url: URL_DROWNED, title: "Drowned villages", copyright: "Provincie Zeeland (opengeodata.zeeland.nl)", minScale: 0, maxScale: 0, popupEnabled: false, renderer: { type: "simple", symbol: drownedSymbol } });

    // The name field is not known in advance: the first text field that looks like a name is used for the labels
    drownedLayer.when(() => {
        const nameField = drownedLayer.fields.find(f => f.type === "string" && /naam|name|dorp/i.test(f.name));
        console.info("Drowned villages: " + (nameField ? "name field = " + nameField.name : "no name field found") +
            " | fields: " + drownedLayer.fields.map(f => f.name).join(", "));
        if (!nameField) return;
        drownedLayer.labelingInfo = [{
            labelExpressionInfo: { expression: "$feature['" + nameField.name + "']" },
            labelPlacement: "above-right",
            minScale: 200000,   // labels only when zoomed in beyond 1:200,000
            symbol: {
                type: "text", color: "#000000",
                font: { size: 11, family: "Barlow Semi Condensed, Barlow, sans-serif" },
                haloColor: "white", haloSize: 1.5
            }
        }];
    }, err => console.warn("Drowned villages could not be loaded", err));

    // The two stops of this map: the Flood Disaster Museum and the drowned villages
    const pointsLayer = new FeatureLayer({
        url: URL_POINTS, outFields: ["*"],
        definitionExpression: "mappa = 'Problem'",
        minScale: 0, maxScale: 0, popupEnabled: false,
        renderer: {
            type: "simple",
            symbol: stopSymbol(STOP_SIZE)
        }
    });

    // Stops that are not in the points layer (they are added here, in the code)
    const extraLayer = new GraphicsLayer();
    const labelLayer = new GraphicsLayer();
    const tooltipLayer = new GraphicsLayer();
    const useEsri = true;   // the basemap is Esri Light Gray Canvas, as in the Solution map
    const map = new Map({
        basemap: "gray-vector",
        layers: [bandsLayer, belowSeaLayer, drownedLayer, pointsLayer, extraLayer, tooltipLayer, labelLayer]   // labels on top of everything
    });

    // The Esri basemap is drawn from vector tiles. Its text labels are hidden by default
    // and the reader can switch them on with the "Aa" button. Icons always stay hidden.
    let labelLayers = [], refLayers = [], labelsOn = false;

    function applyLabels() {
        refLayers.forEach(l => { l.visible = labelsOn; });
        labelLayers.forEach(item => {
            item.ids.forEach(id => item.layer.setStyleLayerVisibility(id, labelsOn ? "visible" : "none"));
        });
    }

    function setupBasemapLabels() {
        const b = map.basemap;
        if (!b) return;
        b.load().then(() => {
            const refs = b.referenceLayers.toArray();
            b.baseLayers.toArray().concat(refs).forEach(layer => {
                if (layer.type !== "vector-tile") {
                    if (refs.indexOf(layer) !== -1) refLayers.push(layer);
                    return;
                }
                layer.load().then(() => {
                    const st = layer.currentStyleInfo && layer.currentStyleInfo.style;
                    if (!st || !st.layers) { console.warn("Basemap style cannot be read"); return; }
                    const sea = seaColorFromStyle(st);
                    if (sea) setBelowSeaGray(sea);
                    const symbols = st.layers.filter(sl => sl.type === "symbol");
                    let texts = symbols.filter(sl => sl.layout && sl.layout["text-field"]);
                    if (!texts.length) texts = symbols;   // fallback: every symbol layer counts as a label
                    const textIds = texts.map(sl => sl.id);
                    symbols.forEach(sl => {
                        if (textIds.indexOf(sl.id) === -1) layer.setStyleLayerVisibility(sl.id, "none");   // icons stay hidden
                    });
                    labelLayers.push({ layer: layer, ids: textIds });
                    console.info("Basemap labels: " + textIds.length + " text layers found");
                    applyLabels();
                });
            });
            applyLabels();
        }).catch(err => console.error("Basemap could not be loaded", err));
    }
    if (useEsri) setupBasemapLabels();

    const view = new MapView({
        container: "viewDiv",
        map: map,
        popupEnabled: false,
        padding: HOME_PADDING,
        extent: HOME,
        constraints: { minScale: 2300000, maxScale: 10000, snapToZoom: false }
    });
    try { view.background = { color: [246, 241, 236] }; } catch (e) {}

    // ── STATE ──
    let allPoints  = [];
    let currentIdx = -1;
    let started    = false;
    let moveId     = 0;
    function noop() {}

    const panel    = document.getElementById("sidePanel");
    const startBtn = document.getElementById("startBtn");

    // ── MAP PADDING — keeps the point centred in the part of the map not covered by the panel ──
    function updateMapPadding() {
        const open = panel.classList.contains("visible");
        document.body.classList.toggle("panel-open", open);
        view.padding = open ? { top: 0, bottom: 0, left: 0, right: panel.offsetWidth } : HOME_PADDING;
    }

    // Fit the whole route inside the free part of the view (computed here, so it does not depend on how the view starts)
    function fitHome(animate) {
        const e = webMercatorUtils.geographicToWebMercator(HOME);
        const pad = view.padding || {};
        const w = view.width - (pad.left || 0) - (pad.right || 0);
        const h = view.height - (pad.top || 0) - (pad.bottom || 0);
        const res = Math.max(e.width / w, e.height / h);
        return view.goTo(
            { target: e.center, scale: res * 96 / 0.0254 },
            animate ? { duration: 1200, easing: "ease-in-out" } : { animate: false }
        );
    }

    // ── PREVIOUS / NEXT ARROWS, floating either side of the selected point ──
    const prevEl = document.getElementById("prevBtn");
    const nextEl = document.getElementById("nextBtn");
    let arrowsOn = false;   // shown only when the map has arrived on the stop

    // The arrows stay where they are on the screen, at the two sides of the free part of the map,
    // so they do not move when the reader pans or zooms.
    // The arrows are anchored to the edges of the free part of the map: 12 px from the left edge
    // and 12 px from the side panel. The panel width is read directly, so the position stays right
    // even when the browser zoom changes.
    function placeStopNav() {
        const show = arrowsOn && (currentIdx >= 0 || STATIC_MAP);
        if (show) {
            const panelW = panel.classList.contains("visible") ? panel.offsetWidth : 0;
            prevEl.style.left = "12px";
            nextEl.style.left = "auto";
            nextEl.style.right = (panelW + 12) + "px";
        }
        prevEl.classList.toggle("on", show);
        nextEl.classList.toggle("on", show);
    }
    function setArrows(on) {
        arrowsOn = on;
        placeStopNav();
    }

    // ── VIDEO (the first one of the stop; any others are linked in the text) ──
    const gallery = document.getElementById("panelGallery");
    const track   = document.getElementById("galleryTrack");
    let videoId   = null;

    function vimeoId(u) {
        const m = /vimeo\.com\/(?:video\/)?(\d+)/.exec(u);
        return m ? m[1] : null;
    }
    function linksOf(a) {
        return String(a.link || "").split(/\s+/).filter(u => /^https?:\/\//.test(u));
    }
    function playerUrl(id, autoplay) {
        return "https://player.vimeo.com/video/" + id + "?dnt=1" + (autoplay ? "&autoplay=1" : "");
    }

    let galleryImage = null;   // { src, credit } of the stop, if it has a photo

    function esc(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function videoSlide(autoplay) {
        return '<div class="gallery-slide"><iframe src="' + playerUrl(videoId, autoplay) + '" title="Video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>';
    }

    // The photo comes first. If the stop also has a video, a play button swaps the photo for the player.
    // Without a photo the video is shown straight away.
    // If Vimeo does not allow this video to be embedded on this site, a clear link replaces the player.
    // The check uses Vimeo's oEmbed service; if the check itself cannot be made, the player is left as it is.
    function guardVideo(id) {
        if (!id) return;
        fetch("https://vimeo.com/api/oembed.json?url=" + encodeURIComponent("https://vimeo.com/" + id))
            .then(r => {
                if (r.status === 401 || r.status === 403 || r.status === 404) blockedVideo(id);
            })
            .catch(() => {});
    }
    function blockedVideo(id) {
        if (videoId !== id) return;   // the reader has already moved to another stop
        track.innerHTML = '<div class="gallery-slide gallery-blocked"><a class="tour-btn" href="https://vimeo.com/' + id + '" target="_blank" rel="noopener">Watch on Vimeo</a></div>';
        gallery.classList.remove("empty");
    }

    function initGallery(urls, image) {
        videoId = urls.map(vimeoId).filter(Boolean)[0] || null;
        galleryImage = image || null;
        if (galleryImage) {
            track.innerHTML = '<div class="gallery-slide"><img src="' + esc(galleryImage.src) + '" alt=""></div>' +
                (galleryImage.credit ? '<span class="gallery-credit">' + esc(galleryImage.credit) + '</span>' : "") +
                (videoId ? '<button class="sq-btn gallery-play" id="playBtn" aria-label="Play video" title="Play video"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>' : "");
            const photo = track.querySelector("img");
            if (photo) photo.addEventListener("error", () => {
                console.warn("Photo not loaded: " + photo.getAttribute("src"));
                if (galleryImage && galleryImage.fallback && !photo.dataset.fallback) {
                    photo.dataset.fallback = "1";
                    photo.src = galleryImage.fallback;   // second try: the copy on Zeeland.com
                } else if (!videoId) {
                    gallery.classList.add("empty");      // no photo at all: the frame disappears
                } else {
                    track.innerHTML = videoSlide(false);
                    guardVideo(videoId);
                }
            });
            const playBtn = document.getElementById("playBtn");
            if (playBtn) playBtn.addEventListener("click", () => { track.innerHTML = videoSlide(true); guardVideo(videoId); });
        } else {
            track.innerHTML = videoId ? videoSlide(false) : "";
            if (videoId) guardVideo(videoId);
        }
        gallery.classList.toggle("empty", !galleryImage && !videoId);
    }

    function clearGallery() {
        track.innerHTML = "";
        videoId = null;
        galleryImage = null;
        gallery.classList.add("empty");
    }

    // ── LIGHTBOX ──
    const lightbox = document.getElementById("lightbox");
    const lightboxFrame = document.getElementById("lightboxFrame");

    function openLightbox() {
        const fr = track.querySelector("iframe");
        if (fr && videoId) {
            fr.src = playerUrl(videoId, false);   // stops the small video
            lightboxFrame.innerHTML = '<iframe src="' + playerUrl(videoId, true) + '" title="Video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
        } else if (galleryImage) {
            const shown = track.querySelector("img");
            lightboxFrame.innerHTML = '<img src="' + esc(shown ? shown.src : galleryImage.src) + '" alt="">';
        } else {
            return;
        }
        lightbox.classList.add("open");
    }
    function closeLightbox() {
        lightbox.classList.remove("open");
        lightboxFrame.innerHTML = "";
    }
    document.getElementById("enlargeBtn").addEventListener("click", openLightbox);
    document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });

    // ── PANEL ──
    function showSidePanel(idx) {
        const a = allPoints[idx].attributes;
        const ed = TEXTS[a.node];
        document.getElementById("locationName").textContent = (ed && ed.title) || a.titolo_en || "Delta Works";
        document.getElementById("locationDescription").textContent = ((ed && ed.text) || String(a.testo_en || "")).trim();
        document.getElementById("counterText").textContent = "Stop " + (idx + 1) + " of " + allPoints.length;
        const plate = document.getElementById("nodePlate");
        plate.textContent = a.node != null ? a.node : "";
        plate.style.display = a.node != null ? "" : "none";

        const urls = linksOf(a);
        const links = document.getElementById("locationLinks");
        links.innerHTML = "";
        urls.forEach((u, i) => {
            const el = document.createElement("a");
            el.href = u; el.target = "_blank"; el.rel = "noopener";
            el.textContent = urls.length > 1 ? "Watch video " + (i + 1) + " on Vimeo" : "Watch on Vimeo";
            links.appendChild(el);
        });
        initGallery(urls, (ed && ed.image) || a.image);
        document.querySelector(".panel-body").scrollTop = 0;
        panel.classList.add("visible");
    }

    // ── LABELS OF THE STOPS ──
    // Each label is level with its dot and sits to the east or to the west of it:
    // a dot in the east half of the map gets its label on the east, a dot in the west half on the west.
    // Dots on the same side that are close to each other (under 9 km) form a group:
    // going from south to north, the labels alternate east, west, east...
    function stopName(f) {
        const ed = TEXTS[f.attributes.node];
        return (ed && ed.title) || f.attributes.titolo_en || "";
    }

    function placeLabels() {
        labelLayer.removeAll();
        const centerLon = (HOME.xmin + HOME.xmax) / 2;
        const stops = allPoints.map(f => {
            const ll = webMercatorUtils.xyToLngLat(f.geometry.x, f.geometry.y);
            return { f: f, lon: ll[0], lat: ll[1], base: ll[0] > centerLon ? "east" : "west", group: -1 };
        });
        stops.forEach(s => { s.side = s.base; });

        const km = (a, b) => Math.hypot(
            (a.lon - b.lon) * 111.32 * Math.cos(a.lat * Math.PI / 180),
            (a.lat - b.lat) * 110.57
        );

        // Groups of close dots (same side)
        let groups = 0;
        stops.forEach((s, i) => {
            if (s.group === -1) s.group = groups++;
            for (let j = i + 1; j < stops.length; j++) {
                const o = stops[j];
                if (o.base === s.base && km(s, o) < 9) {
                    if (o.group === -1) o.group = s.group;
                    else if (o.group !== s.group) {
                        const old = o.group;
                        stops.forEach(x => { if (x.group === old) x.group = s.group; });
                    }
                }
            }
        });
        for (let g = 0; g < groups; g++) {
            const members = stops.filter(s => s.group === g).sort((a, b) => a.lat - b.lat);
            if (members.length < 2) continue;
            members.forEach((s, k) => { s.side = k % 2 === 0 ? "east" : "west"; });
        }

        stops.forEach(s => {
            const east = s.side === "east";
            labelLayer.add(new Graphic({
                geometry: s.f.geometry,
                symbol: {
                    type: "text", text: stopName(s.f), color: "#000000",
                    font: { size: 12, weight: "bold", family: "Barlow Semi Condensed, Barlow, sans-serif" },
                    haloColor: "white", haloSize: 2,
                    horizontalAlignment: east ? "left" : "right",
                    verticalAlignment: "middle",
                    xoffset: east ? 15 : -15
                }
            }));
        });
    }

    // Highlight of the selected stop, copied from the Åsteder map:
    // the light blue ring (size 26, same colours) plus the ArcGIS highlight of the point.
    let highlightHandle = null;

    function clearHighlight() {
        tooltipLayer.removeAll();
        if (highlightHandle) { highlightHandle.remove(); highlightHandle = null; }
    }

    function showPointTooltip(f) {
        clearHighlight();
        tooltipLayer.add(new Graphic({
            geometry: f.geometry,
            symbol: {
                type: "simple-marker",
                color: [74, 127, 158, 0.25],
                size: 26,
                outline: { color: [74, 127, 158, 0.9], width: 3 }
            }
        }));
        const layer = extraLayer.graphics.includes(f) ? extraLayer : pointsLayer;
        view.whenLayerView(layer).then(lv => {
            if (allPoints[currentIdx] === f) highlightHandle = lv.highlight(f);
        }).catch(noop);
    }

    // ── ROUTE (to show the stretch between two stops) ──
    const route = { V: [], cum: [], total: 0, loop: false, ok: false };

    function buildRoute(geom) {
        const V = [];
        geom.paths.forEach(p => p.forEach(c => V.push([c[0], c[1]])));
        const cum = [0];
        for (let i = 1; i < V.length; i++) {
            cum.push(cum[i - 1] + Math.hypot(V[i][0] - V[i - 1][0], V[i][1] - V[i - 1][1]));
        }
        route.V = V;
        route.cum = cum;
        route.total = cum[cum.length - 1];
        route.loop = V.length > 1 &&
            Math.hypot(V[0][0] - V[V.length - 1][0], V[0][1] - V[V.length - 1][1]) < 200;
        route.ok = V.length > 1;
    }

    function nearestVertex(x, y) {
        let best = 0, bd = Infinity;
        const V = route.V;
        for (let i = 0; i < V.length; i++) {
            const dx = V[i][0] - x, dy = V[i][1] - y, d = dx * dx + dy * dy;
            if (d < bd) { bd = d; best = i; }
        }
        return { index: best, dist: Math.sqrt(bd) };
    }

    // Vertices of the route from index ia to index ib, taking the shorter way round the loop
    function pathBetween(ia, ib) {
        const n = route.V.length, cum = route.cum;
        let forward;
        if (route.loop) {
            const fwdLen = ib >= ia ? cum[ib] - cum[ia] : route.total - cum[ia] + cum[ib];
            forward = fwdLen <= route.total - fwdLen;
        } else {
            forward = ib >= ia;
        }
        const out = [route.V[ia]];
        let i = ia, guard = 0;
        while (i !== ib && guard++ < n + 2) {
            i += forward ? 1 : -1;
            if (i >= n) i = 0;
            if (i < 0) i = n - 1;
            out.push(route.V[i]);
        }
        return out;
    }

    // Extent of the stretch of route between stop "from" and stop "to",
    // or null when they are so close that zooming out would only look jumpy
    function routeExtent(from, to) {
        if (!route.ok || from.vi == null || to.vi == null || from.vi === to.vi) return null;
        const p = pathBetween(from.vi, to.vi);
        let xmin = Infinity, ymin = Infinity, xmax = -Infinity, ymax = -Infinity;
        p.forEach(v => {
            if (v[0] < xmin) xmin = v[0];
            if (v[0] > xmax) xmax = v[0];
            if (v[1] < ymin) ymin = v[1];
            if (v[1] > ymax) ymax = v[1];
        });
        const padX = Math.max((xmax - xmin) * 0.2, 1500);
        const padY = Math.max((ymax - ymin) * 0.2, 1500);
        xmin -= padX; xmax += padX; ymin -= padY; ymax += padY;

        const pad = view.padding || {};
        const w = view.width - (pad.left || 0) - (pad.right || 0);
        const h = view.height - (pad.top || 0) - (pad.bottom || 0);
        const res = Math.max((xmax - xmin) / w, (ymax - ymin) / h);
        const scaleNeeded = res * 96 / 0.0254;
        if (scaleNeeded <= SCALE_STOP * 1.3) return null;

        return new Extent({ xmin, ymin, xmax, ymax, spatialReference: view.spatialReference });
    }

    // ── MOVEMENT ──
    // From one stop to the next: a short zoom out on the stretch of route between them, then a zoom in.
    // From the whole map (or after a click on a far point): a single smooth zoom.
    function moveTo(from, to) {
        const id = ++moveId;
        const toStop = d => view.goTo({ target: to.geometry, scale: SCALE_STOP }, { duration: d, easing: "ease-in-out" });

        const arrived = () => { if (id === moveId) setArrows(true); };

        const ext = from ? routeExtent(from, to) : null;
        if (!ext) {
            toStop(1600).then(arrived).catch(noop);
            return;
        }
        view.goTo(ext, { duration: 1400, easing: "ease-in-out" })
            .then(() => new Promise(r => setTimeout(r, 500)))
            .then(() => { if (id === moveId) return toStop(1400).then(arrived); })
            .catch(noop);
    }

    function selectPoint(idx) {
        if (!allPoints.length) return;
        const prev = (started && currentIdx >= 0) ? allPoints[currentIdx] : null;
        started = true;
        startBtn.classList.remove("on");
        currentIdx = (idx + allPoints.length) % allPoints.length;
        const f = allPoints[currentIdx];

        if (STATIC_MAP) {
            // The map does not move: only the panel and the highlight change
            showSidePanel(currentIdx);
            showPointTooltip(f);
            updateMapPadding();
            setArrows(true);
            return;
        }

        setArrows(false);
        showSidePanel(currentIdx);
        showPointTooltip(f);
        updateMapPadding();
        moveTo(prev, f);
    }

    // Introduction shown in the panel when the map opens (static map with START_WITH_INTRO)
    function showIntro() {
        currentIdx = -1;
        clearHighlight();
        clearGallery();
        const plate = document.getElementById("nodePlate");
        plate.textContent = "";
        plate.style.display = "none";
        document.getElementById("locationName").textContent = INTRO.title;
        document.getElementById("locationDescription").textContent = INTRO.text;
        document.getElementById("counterText").textContent = allPoints.length + " stops";
        const links = document.getElementById("locationLinks");
        links.innerHTML = "";
        const btn = document.createElement("button");
        btn.className = "tour-btn";
        btn.textContent = "Start the tour";
        btn.addEventListener("click", () => selectPoint(0));
        links.appendChild(btn);
        panel.classList.add("visible");
        updateMapPadding();
        setArrows(true);
    }

    function closePanel() {
        moveId++;
        started = false;
        currentIdx = -1;
        panel.classList.remove("visible");
        clearGallery();
        closeLightbox();
        clearHighlight();
        setArrows(false);
        updateMapPadding();
        startBtn.classList.add("on");
        // Back to the whole map
        fitHome(true).catch(noop);
    }

    // Back to the selected stop (same framing as when the map arrived), after the reader has moved away
    function recenter() {
        if (STATIC_MAP) { fitHome(true).catch(noop); return; }
        if (currentIdx < 0) return;
        moveId++;
        view.goTo({ target: allPoints[currentIdx].geometry, scale: SCALE_STOP }, { duration: 900, easing: "ease-in-out" }).catch(noop);
    }

    function navigatePrevious() { selectPoint(currentIdx <= 0 ? allPoints.length - 1 : currentIdx - 1); }
    // On the last stop the next arrow ends the tour: the panel goes back to the introduction
    // with the "Start the tour" button, and the map to the whole area (as in the Solution map)
    function navigateNext() {
        if (currentIdx === allPoints.length - 1) {
            started = false;
            if (START_WITH_INTRO) showIntro();
            fitHome(true).catch(noop);
            return;
        }
        selectPoint(currentIdx < 0 ? 0 : currentIdx + 1);
    }

    startBtn.addEventListener("click", () => selectPoint(0));
    document.getElementById("prevBtn").addEventListener("click", navigatePrevious);
    document.getElementById("nextBtn").addEventListener("click", navigateNext);
    document.getElementById("closeBtn").addEventListener("click", closePanel);
    document.addEventListener("keydown", e => {
        if (e.key === "Escape") { closeLightbox(); return; }
        if (lightbox.classList.contains("open")) return;
        if (e.key === "ArrowLeft") navigatePrevious();
        if (e.key === "ArrowRight") navigateNext();
    });

    // Click on a map point; click elsewhere closes the panel
    view.on("click", e => {
        view.hitTest(e, { include: [pointsLayer, extraLayer, tooltipLayer] }).then(r => {
            // The ring around the selected stop counts as the stop itself (it is a bigger target)
            const ring = r.results.find(x => x.graphic && x.graphic.layer === tooltipLayer);
            if (ring && started) { recenter(); return; }
            const hit = r.results.find(x => x.graphic && (x.graphic.layer === pointsLayer || x.graphic.layer === extraLayer));
            if (!hit) { if (started && !STATIC_MAP) closePanel(); return; }
            let idx = allPoints.indexOf(hit.graphic);   // stops added in the code
            if (idx === -1) idx = allPoints.findIndex(f => f.attributes.node != null && f.attributes.node === hit.graphic.attributes.node);
            if (idx === -1) return;
            if (idx === currentIdx && started) recenter(); else selectPoint(idx);
        });
    });

    // Pointer cursor on hover
    view.on("pointer-move", e => {
        view.hitTest(e, { include: [pointsLayer, extraLayer, tooltipLayer] }).then(r => {
            view.container.style.cursor = r.results.length ? "pointer" : "";
        });
    });


    // ── LOAD ──
    if (STATIC_MAP) {
        // The panel is always there: no central start button and no close button
        startBtn.style.display = "none";
        document.getElementById("closeBtn").style.display = "none";
    }

    view.when(() => {
        if (STATIC_MAP) { panel.classList.add("visible"); updateMapPadding(); }
        fitHome(false).catch(noop);
        const loader = document.getElementById("loading");
        loader.classList.add("hidden");
        setTimeout(() => loader.style.display = "none", 700);

        view.ui.move("zoom", "top-left");
        if (useEsri) {
            const labelsBtn = document.getElementById("labelsBtn");
            labelsBtn.style.display = "flex";
            labelsBtn.addEventListener("click", () => {
                labelsOn = !labelsOn;
                applyLabels();
                labelsBtn.setAttribute("aria-pressed", String(labelsOn));
                labelsBtn.title = labelsOn ? "Hide labels" : "Show labels";
            });
            view.ui.add(labelsBtn, "top-left");   // under the zoom buttons
        }

        const qp = pointsLayer.createQuery();
        qp.where = "mappa = 'Problem'";
        qp.outFields = ["*"];
        qp.returnGeometry = true;
        qp.outSpatialReference = view.spatialReference;

        return Promise.all([pointsLayer.queryFeatures(qp)]);
    }).then(res => {
        const feats = res[0].features.slice();

        // The monument is added to the stops of the layer
        const xy = webMercatorUtils.lngLatToXY(MONUMENT.lon, MONUMENT.lat);
        const monument = new Graphic({
            geometry: new Point({ x: xy[0], y: xy[1], spatialReference: view.spatialReference }),
            attributes: { node: null, titolo_en: MONUMENT.title, testo_en: MONUMENT.text, link: "", mappa: "Problem", image: MONUMENT.image },
            symbol: stopSymbol(STOP_SIZE)
        });
        extraLayer.add(monument);
        feats.push(monument);

        // Stops in the order of the story
        const rank = f => { const k = STOP_ORDER.indexOf(f.attributes.node == null ? "monument" : f.attributes.node); return k < 0 ? 99 : k; };
        feats.sort((a, b) => rank(a) - rank(b));
        allPoints = feats;
        placeLabels();

        // The map opens on the whole area
        if (STATIC_MAP) {
            if (START_WITH_INTRO) showIntro(); else selectPoint(0);
        } else {
            startBtn.classList.add("on");
        }
    }).catch(err => {
        console.error(err);
        document.getElementById("loading").classList.add("hidden");
    });

    window.addEventListener("resize", () => { updateMapPadding(); placeStopNav(); });
    // The view knows its new size only after the resize: re-fit the whole route then
    view.watch("size", () => { if (STATIC_MAP) fitHome(false).catch(noop); });
});
</script>
</body>
</html>
